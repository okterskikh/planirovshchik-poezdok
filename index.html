<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Планировщик · Задачи и поездки</title>
  <link rel="stylesheet" href="style.css?v=1.1.2">
  <script src="script.js?v=1.1.2" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Главная навигация">
      <a class="brand" href="#tasks"><span class="brand-mark" aria-hidden="true">П</span><span>Планировщик<small>Задачи и поездки</small></span></a>
      <div class="nav-caption">РАБОЧЕЕ ПРОСТРАНСТВО</div>
      <nav>
        <button class="nav-button active" data-page="week">Неделя</button>
        <button class="nav-button" data-page="day">День</button>
        <button class="nav-button" data-page="tasks">Задачи</button>
        <button class="nav-button" data-page="exchange">Обмен данными</button>
        <button class="nav-button" data-page="settings">Настройки</button>
      </nav>
      <div id="sidebar-backlog" class="sidebar-backlog" hidden></div>
      <div class="sidebar-footer"><span class="local-dot" aria-hidden="true"></span>Данные в этом браузере<small>Версия · 1.1.2</small></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><span id="today"></span><button id="undo-planning" type="button" class="button small" hidden>Отменить действие</button><span id="save-state" role="status">Готово к работе</span></header>
      <div id="alerts" aria-live="polite"></div>
      <main id="main"></main>
      <footer class="workspace-footer">Локальный планировщик · без сервера и автоматической синхронизации</footer>
    </div>
  </div>
  <div id="print-root"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
